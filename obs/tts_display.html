<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Twitch Chat Display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        #image-container { margin-bottom: 10px; }

        #vote-container {
            margin-bottom: 20px;
            text-align: center;
        }

        #vote-question {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .vote-timer {
            font-size: 1em;
            margin-bottom: 10px;
            color: #ccc;
        }

        .vote-option {
            position: relative;
            background-color: #444;
            border-radius: 10px;
            margin: 5px auto;
            width: 80%;
            height: 30px;
            overflow: hidden;
            text-align: left;
        }

        .vote-bar {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            background-color: #00aaff;
            transition: width 0.3s ease;
            z-index: 0;
        }

        .vote-label {
            position: relative;
            padding: 5px 10px;
            z-index: 1;
            white-space: nowrap;
        }

        .vote-options-transition { transition: opacity 0.5s ease; opacity: 1; }
        .vote-options-hidden     { opacity: 0; }

        .vote-option.winner .vote-bar   { background-color: #ff8100; }
        .vote-option.winner .vote-label { font-weight: bold; }

        #messages {
            margin: auto;
            text-align: center;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
        }

        .message, .icon {
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        .fade-out { opacity: 0; }

        .wiggle { animation: wiggle 0.1s infinite alternate; }

        @keyframes wiggle {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(10deg); }
        }

        .icon {
            margin: auto;
            text-align: center;
            width: 50px;
            height: auto;
        }

        .error-message {
            background-color: grey;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin: 5px 0;
        }

        /* ── Notification overlay ── */
        #notif-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            padding-top: 30px;
            z-index: 200;
            pointer-events: none;
            box-sizing: border-box;
            transition: opacity 0.5s ease;
        }

        #notif-card {
            background: #1a1a2e;
            border: 3px solid #9147ff;
            border-radius: 16px;
            padding: 18px 36px;
            text-align: center;
            animation: notifSlide 0.4s ease forwards;
            min-width: 240px;
        }

        #notif-icon-el  { font-size: 2.2em; margin-bottom: 4px; }
        #notif-title    { font-size: 1.1em; font-weight: bold; color: #9147ff; margin-bottom: 4px; transition: color 0.2s; }
        #notif-username { font-size: 1.6em; font-weight: bold; color: white; }

        @keyframes notifSlide {
            from { transform: translateY(-20px); opacity: 0; }
            to   { transform: translateY(0);     opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="image-container">
        <img id="dynamic-image" class="icon wiggle" src="" alt="Dynamic Image" style="display: none;">
    </div>

    <div id="vote-container" style="display: none;">
        <div id="vote-question"></div>
        <div class="vote-timer" id="vote-timer"></div>
        <div id="vote-options"></div>
    </div>

    <div id="messages"></div>

    <div id="notif-overlay" style="display: none;">
        <div id="notif-card">
            <div id="notif-icon-el">🎉</div>
            <div id="notif-title">Alert!</div>
            <div id="notif-username"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        const messagesDiv    = document.getElementById('messages');
        const imageElement   = document.getElementById('dynamic-image');
        const voteContainer  = document.getElementById('vote-container');
        const voteQuestion   = document.getElementById('vote-question');
        const voteOptionsDiv = document.getElementById('vote-options');
        const voteTimer      = document.getElementById('vote-timer');
        const notifOverlay   = document.getElementById('notif-overlay');
        const notifCard      = document.getElementById('notif-card');
        const notifIconEl    = document.getElementById('notif-icon-el');
        const notifTitle     = document.getElementById('notif-title');
        const notifUsername  = document.getElementById('notif-username');

        let ws, voteEndTime = null, voteInterval;
        let imagePath = null;
        let voteCounts = [];
        let currentVote = null;

        // ── TTS state ──
        // Regular messages play immediately and can overlap.
        // activeTTSItems tracks everything currently playing so events can stop them all.
        let activeTTSItems = [];  // [{audio, element, cancelled}]
        let isEventActive  = false;
        let eventQueue     = [];  // pending event functions (subs, notifications)
        let pendingMessages = []; // regular messages held while an event plays

        // ── Regular TTS ──
        function playTTSNow(data) {
            const el = document.createElement('div');
            el.className = 'message';
            el.textContent = data.username === 'TTSystem'
                ? data.message
                : `${data.username}: ${data.message}`;
            messagesDiv.appendChild(el);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            if (!currentVote) {
                imageElement.src = imagePath || 'dwightHead.png';
                imageElement.style.display = 'block';
            }

            if (!data.audio) {
                setTimeout(() => fadeMessage(el), 5000);
                return;
            }

            const audio = new Audio('data:audio/mp3;base64,' + data.audio);
            audio.volume = Math.min(1.0, Math.max(0.0, data.volume || 1.0));

            const item = { audio, element: el, cancelled: false };
            activeTTSItems.push(item);

            const cleanup = () => {
                if (item.cancelled) return;
                activeTTSItems = activeTTSItems.filter(i => i !== item);
                fadeMessage(el);
            };

            audio.addEventListener('ended', cleanup);
            audio.addEventListener('error', cleanup);
            audio.play().catch(cleanup);
        }

        function stopAllTTS() {
            activeTTSItems.forEach(item => {
                item.cancelled = true;
                item.audio.pause();
                fadeMessage(item.element);
            });
            activeTTSItems = [];
        }

        function fadeMessage(el) {
            el.classList.add('fade-out');
            if (messagesDiv.children.length === 1) imageElement.classList.add('fade-out');
            setTimeout(() => {
                if (el.parentNode === messagesDiv) messagesDiv.removeChild(el);
                if (messagesDiv.children.length === 0) {
                    imageElement.style.display = 'none';
                    imageElement.classList.remove('fade-out');
                } else {
                    imageElement.classList.remove('fade-out');
                }
            }, 1000);
        }

        // ── Event system (subs, follows, members, superchats) ──
        // Events serialise through eventQueue; regular messages hold in pendingMessages.
        function triggerEvent(playFn) {
            eventQueue.push(playFn);
            if (!isEventActive) runNextEvent();
        }

        function runNextEvent() {
            if (eventQueue.length === 0) {
                isEventActive = false;
                pendingMessages.splice(0).forEach(playTTSNow);
                return;
            }
            isEventActive = true;
            stopAllTTS();
            eventQueue.shift()(runNextEvent);
        }

        // Plays a sub-style TTS message as an event (confetti, waits for audio end)
        function playEventTTS(data, onEnd) {
            const el = document.createElement('div');
            el.className = 'message';
            el.textContent = data.username === 'TTSystem'
                ? data.message
                : `${data.username}: ${data.message}`;
            messagesDiv.appendChild(el);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            imageElement.src = imagePath || 'dwightHead.png';
            imageElement.style.display = 'block';

            const confettiInterval = setInterval(() => {
                confetti({
                    particleCount: 5,
                    angle: 90,
                    spread: 45,
                    origin: { y: 0 },
                    colors: ['#bb0000', '#ffffff', '#00ff00', '#0000ff']
                });
            }, 200);

            const done = () => {
                clearInterval(confettiInterval);
                fadeMessage(el);
                onEnd();
            };

            if (data.audio) {
                const audio = new Audio('data:audio/mp3;base64,' + data.audio);
                audio.volume = Math.min(1.0, Math.max(0.0, data.volume || 1.0));
                audio.addEventListener('ended', done);
                audio.addEventListener('error', done);
                audio.play().catch(done);
            } else {
                setTimeout(done, 5000);
            }
        }

        // Shows the notification card overlay as an event
        const NOTIF_CONFIG = {
            follow:    { icon: '✨', title: 'New Follower!', color: '#9147ff' },
            member:    { icon: '⭐', title: 'New Member!',   color: '#f9a000' },
            superchat: { icon: '💰', title: 'Super Chat!',   color: '#1aa34a' },
        };

        function showNotificationCard(notif, onEnd) {
            const cfg = NOTIF_CONFIG[notif.type] || { icon: '🎉', title: 'Alert!', color: '#9147ff' };
            notifCard.style.borderColor = cfg.color;
            notifTitle.style.color      = cfg.color;
            notifIconEl.textContent     = cfg.icon;
            notifTitle.textContent      = cfg.title;
            notifUsername.textContent   = `@${notif.username}`;
            notifOverlay.style.opacity  = '1';
            notifOverlay.style.display  = 'flex';

            const confettiInterval = setInterval(() => {
                confetti({
                    particleCount: 8,
                    spread: 70,
                    origin: { y: 0.35 },
                    colors: [cfg.color, '#ffffff', '#ffdd00']
                });
            }, 150);

            let done = false;
            const finish = () => {
                if (done) return;
                done = true;
                clearInterval(confettiInterval);
                notifOverlay.style.opacity = '0';
                setTimeout(() => {
                    notifOverlay.style.display = 'none';
                    notifOverlay.style.opacity = '1';
                    onEnd();
                }, 500);
            };

            if (notif.audio) {
                const audio = new Audio('data:audio/mp3;base64,' + notif.audio);
                const safety = setTimeout(finish, 12000);
                const end = () => { clearTimeout(safety); finish(); };
                audio.addEventListener('ended', end);
                audio.addEventListener('error', end);
                audio.play().catch(end);
            } else {
                setTimeout(finish, 4000);
            }
        }

        // ── Vote UI ──
        function displayMessage(content, isError = false) {
            if (isError) removeErrorMessages();
            const el = document.createElement('div');
            el.className = 'message';
            if (isError) el.classList.add('error-message');
            el.textContent = content;
            messagesDiv.appendChild(el);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeErrorMessages() {
            document.querySelectorAll('.error-message').forEach(el => messagesDiv.removeChild(el));
        }

        function updateVoteUI(vote, isFinal = false) {
            voteContainer.style.display = 'block';
            voteQuestion.textContent = vote.question;

            const totalVotes = voteCounts.reduce((sum, v) => sum + v, 0);
            voteOptionsDiv.classList.add('vote-options-transition', 'vote-options-hidden');

            setTimeout(() => {
                voteOptionsDiv.innerHTML = '';

                let sorted = vote.options.map((option, index) => ({
                    option, count: voteCounts[index] || 0, index
                }));

                let highestCount = 0;
                if (isFinal) {
                    sorted.sort((a, b) => b.count - a.count);
                    highestCount = sorted[0]?.count || 0;
                }

                sorted.forEach(item => {
                    const percent = totalVotes > 0 ? (item.count / totalVotes) * 100 : 0;

                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'vote-option';
                    if (isFinal && item.count === highestCount && highestCount > 0)
                        optionDiv.classList.add('winner');

                    const barDiv = document.createElement('div');
                    barDiv.className = 'vote-bar';
                    barDiv.style.width = percent + '%';

                    const labelDiv = document.createElement('div');
                    labelDiv.className = 'vote-label';
                    labelDiv.textContent = `${item.index + 1}. ${item.option} (${item.count} vote${item.count !== 1 ? 's' : ''})`;

                    optionDiv.appendChild(barDiv);
                    optionDiv.appendChild(labelDiv);
                    voteOptionsDiv.appendChild(optionDiv);
                });

                voteOptionsDiv.classList.remove('vote-options-hidden');
            }, 300);

            if (vote.timeRemaining && !isFinal) {
                voteEndTime = Date.now() + vote.timeRemaining * 1000;
                clearInterval(voteInterval);
                voteInterval = setInterval(() => {
                    const remaining = Math.max(0, Math.floor((voteEndTime - Date.now()) / 1000));
                    voteTimer.textContent = `Time left: ${remaining} second${remaining !== 1 ? 's' : ''}`;

                    if (remaining === 0) {
                        clearInterval(voteInterval);
                        updateVoteUI(vote, true);
                        voteTimer.textContent = 'Voting ended! Showing results...';
                        setTimeout(() => {
                            voteContainer.style.display = 'none';
                            voteCounts = [];
                            currentVote = null;
                            if (ws && ws.readyState === WebSocket.OPEN)
                                ws.send(JSON.stringify({ type: "vote-ended" }));
                        }, 15000);
                    }
                }, 1000);
            }
        }

        // ── WebSocket ──
        function connectWebSocket() {
            const params = new URLSearchParams(window.location.search);
            const wsHost = params.get('host') || 'localhost:8080';
            ws = new WebSocket(`ws://${wsHost}/`);

            ws.onopen = () => {
                console.log('WebSocket connection established');
                removeErrorMessages();
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log(data);

                if (data.imagePath) {
                    imagePath = data.imagePath;
                    return;
                }

                if (data.notification) {
                    triggerEvent(resume => showNotificationCard(data.notification, resume));
                    return;
                }

                if (data.vote) {
                    currentVote = data.vote;
                    voteCounts = Array.isArray(data.voteCounts)
                        ? data.voteCounts
                        : new Array(data.vote.options.length).fill(0);
                    updateVoteUI(currentVote);
                    return;
                }

                if (data.username && data.message) {
                    if (/^\d+$/.test(data.message)) {
                        const voteNum = parseInt(data.message, 10);
                        if (voteCounts[voteNum - 1] !== undefined) {
                            voteCounts[voteNum - 1]++;
                            if (currentVote) updateVoteUI(currentVote);
                        }
                        return;
                    }

                    if (data.isSub) {
                        triggerEvent(resume => playEventTTS(data, resume));
                    } else if (isEventActive) {
                        pendingMessages.push(data);
                    } else {
                        playTTSNow(data);
                    }
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                displayMessage("WebSocket error: " + error.message, true);
            };

            ws.onclose = () => {
                console.log('WebSocket connection closed');
                displayMessage("WebSocket connection closed", true);
            };
        }

        setInterval(() => {
            if (!ws || ws.readyState === WebSocket.CLOSED) {
                console.log('Attempting to reconnect...');
                displayMessage("Attempting to reconnect...", true);
                connectWebSocket();
            }
        }, 5000);

        connectWebSocket();
    </script>
</body>
</html>
